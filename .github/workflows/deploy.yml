# CD: after CI succeeds on main, ship the new images to the free Oracle Cloud VM over SSH.
#
# One-time setup (see docs/DEPLOYMENT.md):
#   Settings -> Secrets and variables -> Actions
#     Secrets:   VM_HOST (public IP), VM_USER (ubuntu), VM_SSH_KEY (private key contents)
#     Variables: DEPLOY_ENABLED = true
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Registry name
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fraudshield" >> "$GITHUB_ENV"

      - name: Copy compose + config files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,monitoring,db,deploy"
          target: "~/fraudshield"

      - name: Pull new images and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,REGISTRY
          command_timeout: 20m
          script: |
            set -e
            cd ~/fraudshield
            bash deploy/release.sh "$REGISTRY" "$IMAGE_TAG" "$GHCR_USER" "$GHCR_TOKEN"

      - name: Verify the deployment from the internet
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.VM_HOST }}:8000/health"; then echo; echo "API healthy"; exit 0; fi
            sleep 10
          done
          echo "API did not become healthy"; exit 1
