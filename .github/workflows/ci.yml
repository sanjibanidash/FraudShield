# CI: lint + unit tests -> full-stack integration test with docker compose -> multi-arch images to GHCR
# Free: GitHub Actions minutes are free for public repos (and 2,000 min/month for private ones);
#       GitHub Container Registry is free for public images.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        run: pytest -v
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

  integration:
    name: End-to-end test (docker compose)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYNTHETIC_ROWS: "100000"
      PRODUCER_TPS: "100"
      MONITOR_INTERVAL: "20"
      MONITOR_MIN_ROWS: "300"
      INSTALL_EVIDENTLY: "false"   # faster CI build; evidently is still installed in released images
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack
        run: |
          cp .env.example .env
          docker compose up -d --build   # smoke_test.sh waits for each component itself
      - name: Smoke test (API, Kafka -> consumer -> Postgres, drift monitor, metrics)
        run: bash scripts/smoke_test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    name: Build & push ${{ matrix.service }}
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, dashboard, producer, consumer, ml]
    steps:
      - uses: actions/checkout@v4
      - name: Registry name (must be lowercase)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fraudshield" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3      # lets us build ARM images for the Oracle Ampere VM
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
