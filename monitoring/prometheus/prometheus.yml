global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: consumer
    static_configs: [{ targets: ["consumer:8001"] }]
  - job_name: producer
    static_configs: [{ targets: ["producer:8002"] }]
  - job_name: monitor
    static_configs: [{ targets: ["monitor:8003"] }]
  - job_name: batch
    static_configs: [{ targets: ["batch:8004"] }]
  - job_name: dashboard
    static_configs: [{ targets: ["dashboard:5000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
